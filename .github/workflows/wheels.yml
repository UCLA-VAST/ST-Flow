# Build the PyPI distributions (installation Tier 1) and publish them on a version tag.
#
# Publishing uses PyPI trusted publishing: no token is stored in this repository.
# One-time setup on pypi.org (project owner): Publishing -> add a GitHub publisher
# for UCLA-VAST/ST-Flow, workflow `wheels.yml`, environment `pypi`.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel:
    runs-on: ubuntu-latest
    steps:
      # The prebuilt LLVM/MLIR is 4.4 GB extracted; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          # The prebuilt LLVM/MLIR targets glibc 2.34, so the wheel is manylinux_2_34
          # (Ubuntu 22.04+, Debian 12+, RHEL/Rocky 9+). Older systems use Tier 3.
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64
          CIBW_BUILD_VERBOSITY: 1
          # CMake downloads and MD5-checks the prebuilt LLVM/MLIR (STFLOW_FETCH_LLVM).
          CIBW_TEST_COMMAND: >-
            python -c "from stflow._mlir._mlir_libs import _streamhls; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
