# Build the PyPI distributions (installation Tier 1) and publish them on a version tag.
#
# The wheel is built inside the manylinux_2_28 container against an LLVM/MLIR built in
# that same container, so it runs on any x86_64 Linux with glibc >= 2.28 (Ubuntu
# 20.04+, Debian 10+, RHEL/Rocky 8+). The prebuilt LLVM on Zenodo cannot be used here:
# it needs GCC 12's C++ runtime, newer than the container's. The LLVM build is cached
# per submodule commit and build script, so only the first run pays for it.
#
# Publishing uses PyPI trusted publishing: no token is stored in this repository.
# One-time setup on pypi.org (project owner): Publishing -> add a GitHub publisher
# for UCLA-VAST/ST-Flow, workflow `wheels.yml`, environment `pypi`.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      # The runner's /mnt disk has room for the LLVM build tree.
      options: -v /mnt:/mnt
    env:
      PY: /opt/python/cp312-cp312/bin/python3.12
      LLVM_PREFIX: /opt/llvm-stflow
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        id: prep
        run: |
          git config --global --add safe.directory '*'
          echo "llvm=$(git ls-tree HEAD extern/llvm-project | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Restore LLVM/MLIR
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/llvm-stflow
          key: llvm-manylinux_2_28-${{ steps.prep.outputs.llvm }}-${{ hashFiles('scripts/build_llvm.sh') }}
      - name: Build LLVM/MLIR (first run only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $PY -m venv /tmp/llvm-venv && . /tmp/llvm-venv/bin/activate
          LLVM_CMAKE_BUILD_DIR=/mnt/llvm-build NUM_THREADS=$(nproc) \
            bash scripts/build_llvm.sh "$LLVM_PREFIX"
          rm -rf /mnt/llvm-build
      # Save right away: a cache saved at the end of the job would be lost if a later
      # step failed, and the LLVM build is by far the slowest step.
      - name: Save LLVM/MLIR
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/llvm-stflow
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build the wheel
        run: |
          $PY -m venv /tmp/build-venv && . /tmp/build-venv/bin/activate
          STFLOW_LLVM_DIR="$LLVM_PREFIX" STFLOW_FETCH_LLVM=OFF \
            pip wheel . --no-deps -w dist-raw -v
          auditwheel repair -w wheelhouse dist-raw/*.whl
          ls -la wheelhouse
      - name: Test the wheel in a fresh environment
        run: |
          $PY -m venv /tmp/test-venv && . /tmp/test-venv/bin/activate
          pip install wheelhouse/*.whl
          # `import stflow` needs the pinned PyTorch front end, as for every user.
          pip install --retries 10 --timeout 120 -r requirements-ml.txt
          cd / && python -c "from stflow._mlir._mlir_libs import _streamhls; import stflow.main; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
