[pytest]
# Default command line arguments
# -ra: show extra test summary info as specified by chars (a=all)
# --timeout: set a default timeout per test (optional)
#
# --import-mode=importlib names test modules by path rather than by basename. This is
# preventive: test/04_wip/ once duplicated four basenames from test/02_synthetic/, and
# under the default prepend mode those collided — `pytest test/` reported an "import file
# mismatch" error for each and then carried on with a reduced test count, which is easy to
# miss. 04_wip has since been removed, so the collection is clean either way; keeping
# importlib mode means a future duplicate basename cannot silently shrink the run.
addopts = -v -n10 --import-mode=importlib

# Directory patterns to search for tests
testpaths = test

# Custom markers if you use them
# markers = 
#    slow: marks tests as slow (deselect with '-m "not slow"')
